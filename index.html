<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Repaso de Emergencias Sanitarias</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="site-header">
        <h1><span class="ambulance-icon">🚑</span> Repaso de Emergencias Sanitarias</h1>
    </header>

    <div class="container">

        <div id="progress-bar-wrapper" class="progress-wrapper hidden">
            <p id="progress-label" class="progress-label"></p>
            <div class="progress-track">
                <div id="progress-fill" class="progress-fill"></div>
                <div id="progress-ambulance" class="progress-ambulance">🚑</div>
            </div>
        </div>

        <div id="instructions" class="card">
            <h2>Instrucciones</h2>
            <p>
                Responde a las 20 preguntas del cuestionario.
                Verás inmediatamente si tu respuesta es correcta o incorrecta
                y podrás continuar pulsando el botón "Siguiente pregunta".
            </p>

            <button id="start-btn">Comenzar actividad</button>
        </div>

        <div id="quiz" class="card hidden">

            <h2 id="question"></h2>

            <div id="answers"></div>

            <div id="feedback"></div>

            <button id="next-btn" class="hidden">
                Siguiente pregunta
            </button>

        </div>

        <div id="result" class="card hidden"></div>

    </div>

    <footer class="site-footer">
        <p>Curso VibeC · Repaso interactivo</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
